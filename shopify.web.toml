name = "Aura Historia Partner Connect"
roles = ["frontend", "backend"]
# App-specific webhook subscriptions are declared in shopify.app.toml.
# Localhost development keeps the app/uninstalled subscription on the deployed
# app URL declared there, so this file does not control the EventBridge ARN.
webhooks_path = "/webhooks/app/uninstalled"

[commands]
predev = "npx prisma generate"
dev = "npx prisma migrate deploy && npm exec react-router dev"
