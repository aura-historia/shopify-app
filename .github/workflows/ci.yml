name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  checks:
    name: ${{ matrix.task }} / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.18.0
          - 24.15.0
          - 26.1.0
        task:
          - lint
          - typecheck
          - test
          - build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Enable Corepack (ensures consistent package managers)
        run: corepack enable

      - name: Use npm 11 (fixes lockfile inconsistencies)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.task }}
        run: npm run ${{ matrix.task }}
