name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  checks:
    name: ${{ matrix.task }} / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.18.0
          - 24.15.0
        task:
          - lint
          - typecheck
          - test
          - build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Debug install state
        run: |
          echo "HEAD:"
          git rev-parse HEAD

          echo "Node:"
          node -v

          echo "npm:"
          npm -v

          echo "package.json TS:"
          npm pkg get devDependencies.typescript

          echo "lockfile TS:"
          node -e "const l=require('./package-lock.json'); console.log(l.packages['node_modules/typescript']?.version)"

          echo "search for 5.9.3:"
          grep -R "5.9.3" . || true

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.task }}
        run: npm run ${{ matrix.task }}
