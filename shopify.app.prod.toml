# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# Production configuration.

client_id = "c16ab3575bcbffd285d378b5caaeb0f8"
name = "Aura Historia"
# Keep the original admin URL handle: changing it breaks existing Shopify admin links.
handle = "aura-historia-partner-connect"
application_url = "https://partner-connect.aura-historia.com"
embedded = true

[access_scopes]
scopes = "read_products,read_locales,read_shipping"
use_legacy_install_flow = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["products/create", "products/update", "products/delete"]
  uri = "arn:aws:events:eu-central-1::event-source/aws.partner/shopify.com/359227195393/aura-historia-backend-prod"

  [[webhooks.subscriptions]]
  topics = ["profiles/create", "profiles/update", "profiles/delete"]
  uri = "https://partner-connect.aura-historia.com/webhooks/shipping"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "https://partner-connect.aura-historia.com/webhooks/shipping"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "https://partner-connect.aura-historia.com/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["bulk_operations/finish"]
  uri = "https://partner-connect.aura-historia.com/webhooks/bulk-operations/finish"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "arn:aws:events:eu-central-1::event-source/aws.partner/shopify.com/359227195393/aura-historia-backend-prod"

[auth]
redirect_urls = [
  "https://partner-connect.aura-historia.com/auth/callback"
]

[app_preferences]
url = "https://partner-connect.aura-historia.com/app"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
